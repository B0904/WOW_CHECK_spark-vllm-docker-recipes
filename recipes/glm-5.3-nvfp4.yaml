# CHAT TEMPLATE KWARGS (set 2026-08-29, per the zai-org/GLM-5.3 model card)
#   reasoning_effort=max  — card: accepts low|high|max, defaults to max if not
#     passed. Set explicitly so it is visible rather than implicit. Roger ran
#     GLM-5.2 at max too, so this keeps the 5.2/5.3 comparison honest.
#     Card notes max is the setting for "benchmark and leaderboard reproduction".
#   clear_thinking=true   — card: "defaults to false if not passed. For chat
#     scenarios, explicitly pass clear_thinking=true." TRUE strips prior-turn
#     reasoning from rendered history; false retains every turn's thinking.
#     At reasoning_effort=max, retained reasoning compounds across turns and
#     inflates effective context far beyond the visible conversation — which
#     slows decode (see the depth curve: 23.07 t/s @50K -> 16.70 @480K).
#     NB this is the OPPOSITE of kimi-k2.7-code.yaml, where the model expects
#     its prior reasoning kept. Do not generalise between the two.
#     eugr sets clear_thinking=false, i.e. the default, NOT the card's advice.
#
# SPECULATION FINDINGS (2026-08-29, measured on this fleet)
#
# MTP2 DOES NOT WORK on this stack, despite num_nextn_predict_layers=1.
#   '{"method":"mtp","num_speculative_tokens":2}' hangs forever in CUDA graph
#   capture at spec_decode/autoregressive/speculator.py:167 (~20 min, never
#   completes; Python-only stack, CPU ~250%, memory flat). Reproduced on two
#   different vLLM builds. Do not retry without a fix for that path.
#
# DFlash2 WORKS because it uses a different code path: spec_decode/dflash2/,
#   speculator.py:141, "Capturing dflash2 CUDA graphs" -> completes 4/4.
#   Needs vLLM >= 0.28.0 (PR #52816).
#
# TWO NON-OBVIOUS REQUIREMENTS:
#   1. "kv_cache_dtype":"auto" on the draft is MANDATORY. DFlash2 is standard
#      attention at head_size=128; inheriting the main model's fp8 KV gives
#      "No valid attention backend found ... FP8 KV cache requires FA3 on SM90
#      or FA4 on SM100". Per-draft kv_cache_dtype is a real SpeculativeConfig field.
#   2. max_model_len had to drop 600000 -> 550000. The draft costs 4.6 GB of
#      weights + bf16 KV; at 600K the engine reports 31.86 GiB needed vs 31.29
#      available (its own estimate: 589184). NB the same log says ~9.5 GiB is
#      unclaimed -- --kv-cache-memory=44079970304 might buy the context back.
#
# MEASURED A/B (2026-08-29): spec=2 15.66 prose / 15.89 code; NO-SPEC 12.85 /
#   12.84; spec=7 8.81. So spec=2 beats no-spec by ~22%, and spec=7 is WORSE
#   than no speculation at all. Prefill ~1575 t/s either way (unaffected).
#   At spec=2: acceptance 35-36%, 1.70 tokens/cycle, per-pos [0.555,0.148,0.0].
#
# ACCEPTANCE IS POOR. At 7 draft tokens: 389/8470 = 4.6% acceptance,
#   1.32 tokens/cycle, decode 8.81 tok/s (GLM-5.2 + MTP2 = 22.45 at 79.1%).
#   Per-position: 0.275, 0.058, 0.000 x5 -- positions 2-6 accept nothing, so
#   num_speculative_tokens was cut to 2 (positions 0-1 carry 91% of accepts).
#   Cause: DFlash2 is trained against reference GLM-5.3, this is an NVFP4
#   post-training quant. Logit drift breaks the draft but NOT correctness
#   (6/6 canaries pass incl. 8347*291). Drafts do not transfer across quants --
#   same lesson as recipes/kimi-k2.7-code.yaml.
#
# --kernel-config enable_flashinfer_autotune=false is REQUIRED: without it
#   startup wedges in the FlashInfer autotuner benchmarking
#   sparse_mla_sm120_decode_dsv3_2 (hit 6+ times, two builds). Cost: heuristic
#   tactics instead of tuned ones.
#
# Recipe: GLM-5.3-NVFP4 (incoai/GLM-5.3-NVFP4)
#
# Deliberately a near-exact copy of glm-5.2-nvfp4.yaml. GLM-5.3 has an
# IDENTICAL architecture to 5.2 (GlmMoeDsaForCausalLM, 78 layers, hidden 6144,
# 64 heads, 256 experts top-8, kv_lora 512, first_k_dense_replace 3,
# index_topk 2048, num_nextn_predict_layers 1, same NVFP4 + FP8 KV), so the
# same mods, parsers, DSA pattern and MTP2 config apply unchanged.
#
# NOT yet validated on 5.3: max_model_len 600000, gmu 0.82, and the 78-char
# index_topk_pattern (structurally correct, but it encodes WHICH layers are
# sparse). Re-run the needle test before trusting depth.
#
# Recipe: GLM-5.3-NVFP4
# Full (unpruned) incoai/GLM-5.3-NVFP4: ~753B/40B-active MoE with DeepSeek
# Sparse Attention (GlmMoeDsaForCausalLM), NVFP4 experts + BF16 attention/
# shared experts, fp8 KV cache. ~465GB of weights -> ~58GB/node on 8 Sparks
# with TP=8 (num_attention_heads=64 and 78 layers divide cleanly).
#
# Requires mods/glm-5.2: sm_121 shared-memory fix for the Triton MLA decode
# kernel (GLM-5.2's Lk=576 head layout overflows the 101376-byte limit).
#
# DSA stays ENABLED (unlike the REAP-pruned community variant, which ships
# broken indexer weights and disables it). index_topk_pattern is passed
# explicitly via --hf-overrides because the checkpoint sets it to null;
# current vLLM main derives the same F/S pattern from index_topk_freq=4 /
# index_skip_topk_offset=3, but the override makes it explicit and guards
# older builds that defaulted null to all-full indexers (garbage at long
# context). The pattern matches the config's indexer_types: 21 "full" +
# 57 "shared" over 78 layers.
#
# REQUIRED since the dev1479 wheel: --attention-config sparse_mla_force_mqa.
# The attention refactor routes "pure prefill" batches whose seq len fits
# within topk_tokens (<=2048) into impl.forward_mha, which the SM120 sparse
# MLA backend leaves as a NotImplementedError stub (backend.py) — the router
# never checks for support. Any multi-chunk prefill (i.e. every real prompt)
# kills the EngineCore (worker NotImplementedError -> scheduler KeyError ->
# EngineDeadError). Forcing MQA keeps all prefill on the dsv3_2 path that
# mods/sparse-mla-chunked feeds, i.e. the pre-refactor behavior. Remove when
# upstream makes the MHA route capability-checked (candidate upstream fix:
# gate use_mha on the backend actually implementing forward_mha).
#
# CONTEXT CEILING RAISED TO 500000 (validated 2026-08-01). The old 400000
# limit had TWO causes, both now addressed:
#   1. persistent_topk 48-CTA ceiling blocked STARTUP above ~400K
#      -> bypassed by mods/glm-topk-per-row (routes decode top-k to
#         ops.top_k_per_row_decode, no CTA/context coupling).
#   2. the DSA indexer's logits scratch transient overran unified memory at
#      deep ACTUAL context (froze spark-01/05/07 at 430K on 2026-07-20)
#      -> capped by CONTAINER_VLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256 in .env.
#         Credit: github.com/0xdfi/GLM-5.2-1M-4x-DGX-Spark, which identified
#         the indexer scratch (not KV cache) as the real memory ceiling.
# VALIDATED: 480,333-token fresh prompt, needles EXACT at 10%/50%/90% depth,
# ~572 tok/s prefill at that depth; memory FLAT across the whole ladder
# (spark-01 6.3GB, workers 10.2-10.3GB, zero NVRM). Control test at 400K
# showed the limiter costs nothing (prefill 845 vs 858, decode 26.2 vs 26.4).
# KV pool at this setting: 654,358 tokens.
#
# HISTORICAL (superseded, kept for context) - why 400000 used to be the wall:
# vLLM's persistent_topk kernel (DSA indexer) runs as a cooperative CTA
# group sized ~1 CTA per ~8350 columns, capped at 48 co-resident CTAs on
# this chip (error at 450000: total_ctas=54 > num_sms*occupancy=48), and
# the FilteredTopK fallback needs 128KB smem/block vs sm_121's 101376.
# 48 x ~8350 = ~400K. 450000/500000/524288 all fail at startup profiling
# (topk.cu:136); 400000 fits exactly. Long-context validated in anger: a
# 319K-token prompt with a needle at 94% depth retrieves exactly, 5-fact
# synthesis across the window is coherent, decode 20.4 tok/s at 332K.
#
# ROOT CAUSE of the silent all-rank wedge this recipe works around:
# FlashInfer's SM120 sparse-MLA attention (used for DSA via the
# FLASHINFER_MLA_SPARSE_SM120 backend, flashinfer 0.6.14) dispatches
# attention calls with <=64 query tokens to a working autotuned kernel
# (decode-dsv3_2) and everything larger to a generic fallback kernel that
# hangs on GB10/sm_121 (data-dependently; reliably for 2048-token chunks).
# One rank hangs there, the other 7 orphan in the next NCCL all-reduce,
# all GPUs spin at ~96% forever with no errors. Verified with
# CUDA_LAUNCH_BLOCKING=1 stack captures on all 8 ranks; raw 8-node NCCL
# all-reduce sweeps up to 128MB are clean, exonerating the fabric.
#
# The workaround: max_num_batched_tokens=64 + block_size=64 keep every
# sparse attention call inside the working kernel's dispatch envelope
# (num_tokens<=64, page_block_size==64, heads/TP=8, topk=2048). Prefill
# is slow (~64 tokens/step, ~180 tok/s) but stable through 20K+ contexts.
# Revisit when flashinfer ships a fallback-kernel fix (their SM120 sparse
# MLA kernels landed 2026-06; see flashinfer PR #3374/#3395, issues
# #3618/#3625 for the related top-k races).
#
# Performance results (2026-07-03, all with mods/sparse-mla-chunked):
# - decode 24.0 tok/s single-stream (MTP2 speculative decoding, 2.53 mean
#   acceptance length), 45-58 tok/s aggregate at 4-way concurrency.
# - prefill ~880 tok/s (fresh short/mid contexts), ~630 tok/s at 320K.
# - GSM8K on this exact config (MTP2): 92.7% strict, full 1319 problems.
#   Baseline without MTP measured 93.1% — within run-to-run noise (+/-0.7%),
#   confirming speculative decoding is lossless under greedy.
# - At 332K context: decode 20.4 tok/s, 5-fact synthesis across 10-90%
#   depth exact, prefill ~635 tok/s.
# - MoE backend: auto (FLASHINFER_CUTLASS main + triton for the BF16 MTP
#   draft layer). Do NOT set --moe-backend marlin with MTP: the draft MoE
#   is unquantized and marlin rejects it. Note upstream vLLM #46834 (MTP
#   garbage) reproduces only with expert parallelism (EP16); plain TP=8
#   is unaffected — validated by needle/canary probes and the subset run.
# - cudagraph mode: default (FULL_AND_PIECEWISE) is stable here; a 60-req
#   soak + two GSM8K runs saw zero hangs.
# - flashinfer_b12x MoE (mods/b12x-min): works but no win (12.6 tok/s);
#   decode is all-reduce-latency-bound so MoE kernels barely matter.
# Operational notes:
# - Never run two launcher invocations concurrently: a still-running
#   launch-cluster.sh execs a second vllm serve into new containers
#   (EADDRINUSE on the master port, phantom crashes).
# - If launches hang silently in distributed init right after "Model
#   loading took", clear ~/.cache/vllm/torch_compile_cache and
#   flashinfer_autotune_cache on ALL nodes (a hard-crashed launch can
#   poison them).
# - Config changes that alter the compiled graph (MoE backend, cudagraph
#   mode, spec config) trigger a ~10-20 min cold torch.compile: silent
#   logs with idle GPU and ~70% worker CPU is normal during it.

recipe_version: "1"
name: GLM-5.3-NVFP4
description: vLLM serving incoai/GLM-5.3-NVFP4 on an 8x DGX Spark cluster (TP=8, DSA enabled)

# HuggingFace model to download (optional, for --download-model)
model: incoai/GLM-5.3-NVFP4

# Container image to use
container: vllm-node

# Can only be run in a cluster
cluster_only: true

# sm_121 Triton MLA decode kernel fix
mods:
  - mods/glm-5.2
  - mods/sparse-mla-chunked
  # vLLM #46074: indexer buffer off-by-one with MTP at block-aligned
  # max_model_len (400000/64=6250 exactly — we sit on the trigger)
  # REQUIRED for >400K: lifts the persistent_topk 48-CTA ceiling. Must be
  # paired with CONTAINER_VLLM_SPARSE_INDEXER_MAX_LOGITS_MB=256 in .env,
  # which caps the indexer transient that froze nodes at 430K on 2026-07-20.
  # Both validated together 2026-08-01 at 480K, multi-depth needles exact.
  - mods/glm-topk-per-row
  - mods/deepgemm-sm121-headers

# Default settings (can be overridden via CLI where supported)
defaults:
  port: 8000
  host: 0.0.0.0
  tensor_parallel: 8
  # 0.82 since the dev1479 wheel: its memory profiler accounts CUDA-graph
  # memory and sizes the KV pool larger, leaving the head node ~3GB of host
  # slack at 0.85 (99x NVRM NV_ERR_NO_MEMORY during boot warmup, first
  # request OOM-crashed the engine fleet-wide). Same relief valve as the
  # Kimi head-node OOM. Healthy gate: zero NVRM errors through boot+canary.
  gpu_memory_utilization: 0.82
  max_model_len: 600000   # native MTP frees the 4.6 GB DFlash2 draft held, so 600K fits again:
                          # KV is 53.5 KiB/token, 600K needs 30.6 GiB, pool is 32.1 GiB.
                          # (with DFlash2 this failed: needed 31.86 vs 31.29 available)
  block_size: 64
  max_num_seqs: 4
  # 2048 requires mods/sparse-mla-chunked (chunks attention calls into
  # <=64-token slices through the working dsv3_2 kernel; the generic
  # fallback kernel for >64-token calls hangs on sm_121). Without that
  # mod this MUST be <=64. block_size must stay 64 (dsv3_2 page size).
  max_num_batched_tokens: 4096

# Environment variables
# WARNING (2026-07-26): with the ray executor, these exports only reach the
# head node's serve process — ray worker ranks on the other 7 nodes DO NOT
# inherit them. Anything that must be set on every rank (NCCL pins, allocator
# config) must ALSO live in .env as CONTAINER_<VAR>=<value>, which becomes a
# docker -e flag on all nodes. The NCCL/PYTORCH/MALLOC/VLLM pins below are
# duplicated there; keep both in sync. (Found via torch-profiler trace:
# unpinned remote ranks let NCCL 2.28.9's tuner pick the LL protocol for
# prefill's ~25MB all-reduces — 76% of prefill wall time, 880 -> 330 tok/s.)
env:
  # ROOT-CAUSE FIX for the silent all-rank wedge (GPU ~96%, low power, no
  # errors) that hit any request beyond trivial size: FlashInfer's
  # RadixTopKMaskLogitsMultiCTA sampling kernel has a multi-CTA barrier
  # reset race that bites SM120/121 first (fixed upstream in
  # flashinfer-ai/flashinfer#3615; vLLM #44405 default-disables the
  # sampler on these chips). Until those land in our build, use the
  # torch-native sampler.
  VLLM_USE_FLASHINFER_SAMPLER: "0"
  VLLM_USE_AOT_COMPILE: "1"        # from eugr 8x recipe
  VLLM_USE_V2_MODEL_RUNNER: "1"    # from eugr 8x recipe
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  # 465GB of weights: don't let the engine time out during load/warmup
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1200"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  MALLOC_ARENA_MAX: "2"
  # No NCCL_IB_GID_INDEX / NCCL_IB_TC overrides: the second RoCE rail
  # (roceP2p1s0f0) only exposes link-local GIDs 0-1, so a global GID index
  # of 3 fails NCCL init. NCCL auto-selects the right GID per HCA.
  NCCL_NVLS_ENABLE: "0"
  # Conservative NCCL transport pins, adopted from the working 8x-Spark
  # TP=8 Kimi-K2.6 deployment (eugr issue #260). Not implicated in the
  # sparse-MLA wedge (raw NCCL swept clean without them) but kept as
  # known-good; candidates to drop when tuning.
  NCCL_PROTO: Simple
  NCCL_ALGO: Ring     # KEPT after testing 2026-09-03. Removing it (as was done for
                      # Kimi-K3, worth +24-30% there) does NOT work for GLM: NCCL
                      # auto-selection allocates buffers for MULTIPLE algorithms, costing
                      # ~5.7 GiB of GPU memory. Available KV drops 31.73 -> ~26.0 GiB
                      # (reproduced 3x), so 600K no longer fits (engine estimates max
                      # ~510K). K3 was immune because its KV pool is PINNED via
                      # --kv-cache-memory-bytes, so the extra NCCL buffers came out of
                      # unused headroom; GLM sizes KV from gpu-memory-utilization, so they
                      # eat context directly. The upside is also smaller here: GLM is TP=8
                      # (Ring 2(8-1)=14 hops vs Tree ~6) where K3 is TP=16 (30 vs 8).
                      # Context at 600K is worth more than a small decode gain.
  NCCL_NCHANNELS: "1"
  NCCL_CROSS_NIC: "0"
  NCCL_IB_QPS_PER_CONNECTION: "1"
  NCCL_IB_TIMEOUT: "25"
  NCCL_IB_RETRY_CNT: "7"
  NCCL_IB_ROCE_VERSION_NUM: "2"
  NCCL_IB_ADDR_FAMILY: AF_INET

# The vLLM serve command template
command: |
  vllm serve incoai/GLM-5.3-NVFP4 \
  --served-model-name GLM-5.3-NVFP4 \
  --host {host} \
  --port {port} \
  --trust-remote-code \
  --tensor-parallel-size {tensor_parallel} \
  --kv-cache-dtype fp8 \
  --block-size {block_size} \
  --max-model-len {max_model_len} \
  --max-num-seqs {max_num_seqs} \
  --max-num-batched-tokens {max_num_batched_tokens} \
  --gpu-memory-utilization {gpu_memory_utilization} \
  --speculative-config '{{"method":"mtp","num_speculative_tokens":4,"attention_backend":"FLASHINFER_MLA_SPARSE_SM120","draft_tensor_parallel_size":1,"quantization":"compressed-tensors"}}' \
  --attention-config '{{"sparse_mla_force_mqa": true}}' \
  --hf-overrides '{{"index_topk_pattern": "FFFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSSFSSS"}}' \
  --no-enable-flashinfer-autotune \
  --async-scheduling \
  --long-prefill-token-threshold 2048 \
  --compilation-config '{{"cudagraph_mode":"FULL_AND_PIECEWISE","custom_ops":["all"]}}' \
  --seed 42 \
  --default-chat-template-kwargs '{{"reasoning_effort":"max","clear_thinking":true}}' \
  --enable-prefix-caching \
  --distributed-executor-backend ray \
  --enable-auto-tool-choice \
  --tool-call-parser glm47 \
  --reasoning-parser glm45 \
  --generation-config auto \
  --load-format instanttensor
