# KIMI-K3 MXFP4 — v3 sm121 image + TP16 + DCP8 + RedHat DSpark s6
#
# Production recipe. All fixes/perf mods are baked into the image — mods: []
# TP16 with DCP8: MLA latent KV is split 8x across ranks for the decode pass,
# which improves long-context decode speed versus plain TP16.
# 2M total context capacity, so 4 requests can each use 500k context.

recipe_version: "1"
name: kimi-k3-dcp-tp16-prd
description: KIMI-K3 v3 sm121 (baked mods) + DCP8 + RedHat DSpark s6, TP16, 16 GB10
# raw_entrypoint: true   # NOT supported by this harness -> pass --keep-entrypoint on the CLI
# shared_weights_nfs: true  # NOT supported here; weights are in each node's local HF cache
cluster_only: true

container: ghcr.io/ciprianveg/gb10-vllm/kimi-k3:v3-sm121
container_name: vllm_node_kimi3_prd

model: moonshotai/Kimi-K3

defaults:
  model_path: /root/.cache/huggingface/hub/models--moonshotai--Kimi-K3/snapshots/a590ce090cb049c93a33dfe8c208ec652aa20503
  draft_model_path: /root/.cache/huggingface/hub/models--RedHatAI--Kimi-K3-speculator.dspark/snapshots/48beb88daae33227c148ea2b78a2ac2f493dbccb

mods: []

env:
  # --- recovered from the image entrypoint (/opt/kimi-k3/vllm/serve-*.sh) ---
  # We bypass that entrypoint so run-recipe can exec our command, so these
  # must be set explicitly or the B12X/DSpark paths silently misconfigure.
  B12X_MOE_FORCE_A16: "1"
  B12X_MOE_WORKSPACE_TOKEN_LIMIT: "1024"
  B12X_PCIE_DCP_BLOCK_LIMIT: "8"
  B12X_PCIE_DCP_THREADS: "512"
  B12X_PCIE_HIERARCHICAL_BF16X2: "1"
  B12X_PCIE_HIERARCHICAL_BF16X2_MAX_ELEMENTS: "7168"
  B12X_PCIE_HIERARCHICAL_DEFERRED_CONSUMPTION: "1"
  B12X_PCIE_HIERARCHICAL_DOUBLE_BUFFER: "0"
  B12X_PCIE_HIERARCHICAL_NANOSLEEP_CYCLES: "24"
  B12X_PCIE_HIERARCHICAL_THREADS: "256"
  B12X_PCIE_KIMI_TOPK_THREADS: "384"
  B12X_W4A16_SMALL_M_DIRECT: "1"
  B12X_W4A16_SMALL_M_HOST_BARRIER_RESET: "0"
  INSTANTTENSOR_BACKEND: "AIO"
  NCCL_P2P_DISABLE: "0"
  PYTHONPATH: "/opt/kimi-k3/vllm:/opt/kimi-k3/b12x"
  VLLM_DCP_A2A_LARGE_BACKEND: "ag_rs"
  VLLM_DCP_A2A_MAX_TOKENS: "8"
  VLLM_DISABLE_SHARED_EXPERTS_STREAM: "1"
  VLLM_DSPARK_CAPTURE_SHARDED_MARKOV: "1"
  VLLM_DSPARK_COMPACT_ROPE: "1"
  VLLM_DSPARK_REPLICATE_MARKOV_W1: "1"
  VLLM_DSPARK_SHARD_MARKOV_HEAD: "1"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"   # GB10 has 48 SMs, B12X PCIe path needs 128 -> always falls back
  VLLM_K3_KV_GROUP_SIZE: "6"
  VLLM_KIMI_K3_B12X_DSPARK_ARGMAX: "1"
  VLLM_KIMI_SHARD_QKV_A: "1"
  VLLM_KIMI_USE_B12X_BATCHED_PROJECTION_TOPK: "0"
  VLLM_KIMI_USE_B12X_PAIRED_PROJECTION_GATHER: "1"
  VLLM_KIMI_USE_B12X_PAIRED_PROJECTION_TOPK: "1"
  VLLM_KIMI_USE_B12X_PROJECTION_GATHER: "1"
  VLLM_MLA_CHUNKED_PREFILL_WORKSPACE_SIZE: "4096"
  VLLM_PCIE_ALLREDUCE_BACKEND: "b12x"
  VLLM_PCIE_ONESHOT_SINGLE_CHANNEL: "1"
  VLLM_USE_B12X_DCP_A2A: "0"        # same: cannot initialise on 48 SMs
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  # --- end recovered block ---
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  HF_HOME: /root/.cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "1"
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"
  VLLM_KIMI_FUSED_TOPK16: "1"
  VLLM_USE_FLASHINFER_MOE_FP4: "1"
  VLLM_USE_FLASHINFER_MOE_FP16: "1"
  VLLM_NVFP4_GEMM_BACKEND: flashinfer-b12x
  VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  CUDA_MODULE_LOADING: LAZY
  CUDA_MODULE_DATA_LOADING: LAZY
  SAFETENSORS_FAST_GPU: "1"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: WARN
  NCCL_NVLS_ENABLE: "0"
  NCCL_BUFFSIZE: "16777216"
  NCCL_MAX_NCHANNELS: "4"   # Veghes rec 2026-08-25; +50% prefill (876->1316 t/s), -3..-9% decode
  NCCL_MIN_NCHANNELS: "4"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "0"
  INSTANTTENSOR_MAX_FREE_MEM_USAGE: "0.5"
  INSTANTTENSOR_COPY: "1"
  INSTANTTENSOR_BUFFER_SIZE: "536870912"
  VLLM_DSPARK_DRAFT_KV_WINDOW: "32768"
  VLLM_DCP_SHARD_DRAFT: "0"
  OMP_NUM_THREADS: "8"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "1"
  RAY_CGRAPH_get_timeout: "1800"
  RAY_memory_monitor_refresh_ms: "0"
  TORCH_EXTENSIONS_DIR: /root/.cache/huggingface/torch_extensions
  TORCHINDUCTOR_CACHE_DIR: /root/.cache/huggingface/torchinductor-cache
  TRITON_CACHE_DIR: /root/.cache/huggingface/triton-cache
  XDG_CACHE_HOME: /root/.cache/huggingface

command: |
  vllm serve {model_path} \
    --served-model-name KIMI-K3 \
    --attention-backend B12X_MLA \
    --tensor-parallel-size 16 \
    --pipeline-parallel-size 1 \
    --decode-context-parallel-size 8 \
    --dcp-kv-cache-interleave-size 1 \
    --enable-expert-parallel \
    --disable-custom-all-reduce \
    --distributed-executor-backend ray \
    --moe-backend marlin \
    --kv-cache-dtype fp8 \
    --load-format instanttensor \
    --gpu-memory-utilization 0.881 \
    --kv-cache-memory-bytes 5000000000 \
    --max-model-len 500000 \
    --host 0.0.0.0 --port 8000 \
    --trust-remote-code \
    --async-scheduling \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --speculative-config '{{"method":"dspark","model":"{draft_model_path}","num_speculative_tokens":8,"draft_tensor_parallel_size":1,"draft_sample_method":"greedy","rejection_sample_method":"block" ,"attention_backend":"TRITON_ATTN"}}' \
    --max-num-batched-tokens 4096 \
    --max-num-seqs 4 \
    --enforce-eager \
    --reasoning-parser kimi_k3 \
    --tool-call-parser kimi_k3 \
    --enable-auto-tool-choice \
    --generation-config vllm \
    --attention-config '{{"use_prefill_query_quantization":true}}' \
    --limit-mm-per-prompt '{{"image":64,"video":0}}' \
    --disable-uvicorn-access-log
