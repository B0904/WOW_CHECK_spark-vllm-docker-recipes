# Kimi-K3 on the v4-prd image, pointed at the STOCK moonshotai/Kimi-K3 MXFP4
# weights (NOT the QSRT checkpoint v4's own script defaults to).
#
# WHY: v4-prd's bundled script serve-kimi-k3-qsrt.sh expects
#   /data/models/Kimi-K3-QSRT-SQG-XOR-CHEB-T12-3p08-v2-mm-mxfp8-model  (~3.08bpw,
#   multimodal, mxfp8) and defaults to TP=12 / max_model_len 262144. Roger runs
#   the stock MXFP4 weights at TP=16/DCP=16/1M and is not adopting a ~2-3bpw
#   quant. So this recipe keeps the v3 command wholesale and only swaps the image.
#
# NOTE v4's /usr/local/bin/serve-kimi-k3-* wrappers are BROKEN — they exec
#   serve-kimi-k3-full-mxfp4-dcp16-1m-dspark.sh which no longer exists in the
#   image. Irrelevant here because run-recipe supplies its own command (and we
#   must NOT pass --keep-entrypoint), but it means the image is not usable
#   as-shipped for the stock weights.
#
# v4 vs v3: torch 2.11->2.13, CUDA 13.2->13.3, flashinfer 0.6.15.post1 (v3 had
#   0.6.15 too), vllm 0.26.1rc0+kimi.k3.aligned.vllme755f87.b12x2d466e.
#   /opt/venv/bin/python still present with vllm; /opt/kimi-k3/{vllm,b12x} intact.
#
# KIMI-K3 MXFP4 — v3 sm121 image + TP16 + DCP8 + RedHat DSpark s6
#
# Production recipe. All fixes/perf mods are baked into the image — mods: []
# TP16 with DCP8: MLA latent KV is split 8x across ranks for the decode pass,
# which improves long-context decode speed versus plain TP16.
# 2M total context capacity, so 4 requests can each use 500k context.

# v4 CHANGE: the four VLLM_DSPARK_* Markov/rope overrides inherited from the v3
# script are REMOVED. v4's own script sets none of them, and forcing
# VLLM_DSPARK_SHARD_MARKOV_HEAD=1 trips a hard guard in
# vllm/models/kimi_k3/nvidia/dspark_mla.py:
#   if envs.VLLM_DSPARK_SHARD_MARKOV_HEAD and not model.supports_local_draft_argmax():
#       raise RuntimeError("A TP-sharded DSpark Markov head requires matching "
#                          "rank-local target and Markov vocabulary projections.")
# supports_local_draft_argmax() is False for the stock MXFP4 weights (it holds
# for the QSRT checkpoint v4 targets). VLLM_DSPARK_DRAFT_KV_WINDOW is kept.

# IMAGE LIMIT: --limit-mm-per-prompt is REMOVED (2026-08-30). vLLM's default is
# 999 per modality (config/multimodal.py: `count: int = Field(999, ge=0)`), so
# the old `image:64` was CAPPING Roger's agentic image work at 64. Dropping the
# flag raises the cap to 999 rather than lowering it.

# CUDA GRAPHS TESTED 2026-08-30 AND REVERTED. Removing --enforce-eager DOES work
# on v4: cudagraph_mode became FULL_AND_PIECEWISE, captures completed (FULL 2/2,
# PIECEWISE 7/7, dspark FULL 2/2), no spec-decode downgrade warning -- B12X_MLA's
# AttentionCGSupport.UNIFORM_BATCH holds. But it gave NOTHING: prose 13.90 vs
# 14.82 eager, code 14.63 vs 15.18, prefill neutral.
# WHY, vs the 2.05x graphs were worth on Kimi-K2.7: graphs remove kernel-LAUNCH
# overhead. K2.7 at TP=8 (14 hops) is far less network-bound. K3 at TP=16 (30
# hops) spends ~69%% of decode waiting on collectives, so cutting launch overhead
# out of the other 31%% does not move the total.

# NCCL_ALGO=Tree TESTED 2026-08-30 AND REVERTED — IT BREAKS STARTUP.
# Rationale was sound (Ring = 2(N-1) = 30 sequential hops at TP=16 vs Tree's
# ~8, and decode all-reduces are ~14 KB / latency-bound, ~69% of decode time).
# But NCCL_ALGO is GLOBAL, and Tree only implements AllReduce. The InstantTensor
# weight loader calls ncclAllGather, which Tree cannot serve:
#   csrc/loader_io_aio.cpp:133 'ncclAllGather(...)' -> 5:invalid usage
#   Executor worker thread exception: std::exception
# It dies during worker init, before any weights load. If Tree is ever retried
# it must be scoped to the all-reduce path only, not set globally.

# DCP 8 -> 16 (2026-09-01). Veghes recommends this for 500k+ work: "at 700k the
# speed of 350k with a slight decrease in speed at < 50k context" and "almost
# double your max context to cca 3M". His OWN v3 serve script hard-requires
# DCP_SIZE=16 and exits otherwise -- the 8 here was a divergence carried from the
# original adaptation, so every prior benchmark ran on a config he would refuse.
# DCP shards KV by sequence position: at 16 each rank holds/reads half the KV it
# did at 8. K3 is the deep-context batch model here, so the <50k regression is
# the right thing to trade away.
# CAVEAT: DCP16 used to cap at 270K with NaN/generation-loops until
# local-inference-lab/vllm PR #418 kept the recurrent KDA cache unsharded. That
# is fixed in v3+ and this is v4, but RUN A NEEDLE TEST at depth before trusting
# it -- that history is likely why DCP=8 was chosen originally.

# NCCL_ALGO=Tree: TESTED THREE WAYS 2026-08-30/09-01, ALL FAIL. Do not retry
# without new information.
#   bare `Tree`                                        -> ncclAllGather 5:invalid usage
#   `allreduce:tree`                                   -> same
#   `allreduce:tree,ring;allgather:ring;reducescatter:ring` -> same
# NCCL logs "NCCL_ALGO set by environment to <value>" in every case, so it reads
# the string but this custom /opt/local-inference NCCL 2.31.2 build does not honour
# the per-collective prefix syntax; anything non-Ring breaks InstantTensor's
# ncclAllGather during weight load, before a single weight is read.
# The MOTIVATION remains valid and unaddressed: .env line 13 sets
# CONTAINER_NCCL_ALGO=Ring fleet-wide (from GLM-5.2 tuning), pinning ALL
# collectives to Ring's 2(N-1)=30 sequential hops at TP=16 where Tree would use
# ~8. Decode all-reduces are ~14 KB and latency-bound, ~69% of decode time.
# The untried alternative is removing NCCL_ALGO from .env so NCCL's tuner picks
# per message size -- but that is fleet-wide and would affect GLM too, so it
# needs Roger's call, not an autonomous change.

# fuse_allreduce_rms TESTED 2026-09-01 AND REVERTED (neutral). Veghes's v3 script
# sets --compilation-config with pass_config.fuse_allreduce_rms=true. It applies
# cleanly here even under --enforce-eager ("fuse_allreduce_rms': True" in the log)
# but measured neutral: prose 16.80 vs 16.82, code 17.44 vs 17.87, prefill 1362
# vs 1372 — all inside sample spread. Removed to keep the config minimal.

recipe_version: "1"
name: kimi-k3-v4
description: KIMI-K3 v3 sm121 (baked mods) + DCP8 + RedHat DSpark s6, TP16, 16 GB10
# raw_entrypoint: true   # NOT supported by this harness -> pass --keep-entrypoint on the CLI
# shared_weights_nfs: true  # NOT supported here; weights are in each node's local HF cache
cluster_only: true

container: ghcr.io/ciprianveg/gb10-vllm/kimi-k3:v4-prd
container_name: vllm_node_kimi3_prd

model: moonshotai/Kimi-K3

defaults:
  model_path: /root/.cache/huggingface/hub/models--moonshotai--Kimi-K3/snapshots/a590ce090cb049c93a33dfe8c208ec652aa20503
  draft_model_path: /root/.cache/huggingface/hub/models--RedHatAI--Kimi-K3-speculator.dspark/snapshots/48beb88daae33227c148ea2b78a2ac2f493dbccb

mods: []

env:
  # --- recovered from the image entrypoint (/opt/kimi-k3/vllm/serve-*.sh) ---
  # We bypass that entrypoint so run-recipe can exec our command, so these
  # must be set explicitly or the B12X/DSpark paths silently misconfigure.
  B12X_MOE_FORCE_A16: "1"
  B12X_MOE_WORKSPACE_TOKEN_LIMIT: "1024"
  B12X_PCIE_DCP_BLOCK_LIMIT: "8"
  B12X_PCIE_DCP_THREADS: "512"
  B12X_PCIE_HIERARCHICAL_BF16X2: "1"
  B12X_PCIE_HIERARCHICAL_BF16X2_MAX_ELEMENTS: "7168"
  B12X_PCIE_HIERARCHICAL_DEFERRED_CONSUMPTION: "1"
  B12X_PCIE_HIERARCHICAL_DOUBLE_BUFFER: "0"
  B12X_PCIE_HIERARCHICAL_NANOSLEEP_CYCLES: "24"
  B12X_PCIE_HIERARCHICAL_THREADS: "256"
  B12X_PCIE_KIMI_TOPK_THREADS: "384"
  B12X_W4A16_SMALL_M_DIRECT: "1"
  B12X_W4A16_SMALL_M_HOST_BARRIER_RESET: "0"
  INSTANTTENSOR_BACKEND: "AIO"
  NCCL_P2P_DISABLE: "0"
  PYTHONPATH: "/opt/kimi-k3/vllm:/opt/kimi-k3/b12x"
  VLLM_DCP_A2A_LARGE_BACKEND: "ag_rs"
  VLLM_DCP_A2A_MAX_TOKENS: "8"
  VLLM_DISABLE_SHARED_EXPERTS_STREAM: "1"
  VLLM_ENABLE_PCIE_ALLREDUCE: "0"   # TESTED ON v4 2026-08-30 AND REVERTED. The old "needs 128 SMs"
                                    # note was v3-era and IS stale: v4 lists HIERARCHICAL_WORLD_SIZES
                                    # =(12,16) and _DENSE_SPARK_MAX_SMS=64, so world_size 16 on GB10
                                    # is accepted and it starts cleanly. But it does NOT help:
                                    # prose 14.37 vs 14.82 off, code 13.14 vs 15.18, prefill neutral.
                                    # Likely because "PCIe all-reduce" targets GPUs sharing a PCIe
                                    # fabric in ONE host; Sparks are separate machines over RoCE.
  VLLM_K3_KV_GROUP_SIZE: "6"
  VLLM_KIMI_K3_B12X_DSPARK_ARGMAX: "1"
  VLLM_KIMI_SHARD_QKV_A: "1"
  VLLM_KIMI_USE_B12X_BATCHED_PROJECTION_TOPK: "0"
  VLLM_KIMI_USE_B12X_PAIRED_PROJECTION_GATHER: "1"
  VLLM_KIMI_USE_B12X_PAIRED_PROJECTION_TOPK: "1"
  VLLM_KIMI_USE_B12X_PROJECTION_GATHER: "1"
  VLLM_MLA_CHUNKED_PREFILL_WORKSPACE_SIZE: "4096"
  VLLM_PCIE_ALLREDUCE_BACKEND: "b12x"
  VLLM_PCIE_ONESHOT_SINGLE_CHANNEL: "1"
  VLLM_USE_B12X_DCP_A2A: "0"        # TESTED 2026-09-01 AND REVERTED. It DOES start on v4 (the old
                                    # "cannot initialise on 48 SMs" note was v3-era and stale, same
                                    # as the PCIe one). But: decode +3.7% prose / -1.4% code (noise)
                                    # and prefill @75K 1216 vs 1372 t/s = -11%. Net negative.
  VLLM_USE_B12X_MOE: "1"
  VLLM_USE_BREAKABLE_CUDAGRAPH: "1"
  VLLM_WORKER_MULTIPROC_METHOD: "spawn"
  # --- end recovered block ---
  VLLM_EXECUTE_MODEL_TIMEOUT_SECONDS: "1800"
  HF_HOME: /root/.cache/huggingface
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  VLLM_ALLOW_LONG_MAX_MODEL_LEN: "1"
  VLLM_USE_V2_MODEL_RUNNER: "1"
  TORCH_CUDA_ARCH_LIST: "12.1a"
  CUTE_DSL_ARCH: "sm_121a"
  VLLM_MARLIN_USE_ATOMIC_ADD: "1"
  VLLM_KIMI_K3_SHARD_SP_SHARED_EXPERT: "1"
  VLLM_PREFIX_CACHE_RETENTION_INTERVAL: "0"
  VLLM_KIMI_FUSED_TOPK16: "1"
  VLLM_USE_FLASHINFER_MOE_FP4: "1"
  VLLM_USE_FLASHINFER_MOE_FP16: "1"
  VLLM_NVFP4_GEMM_BACKEND: flashinfer-b12x
  VLLM_FLASHINFER_ALLREDUCE_BACKEND: trtllm
  FLASHINFER_DISABLE_VERSION_CHECK: "1"
  PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
  CUDA_MODULE_LOADING: LAZY
  CUDA_MODULE_DATA_LOADING: LAZY
  SAFETENSORS_FAST_GPU: "1"
  NCCL_NET: IB
  NCCL_IB_DISABLE: "0"
  NCCL_IB_GID_INDEX: "3"
  NCCL_CROSS_NIC: "1"
  NCCL_CUMEM_ENABLE: "0"
  NCCL_IGNORE_CPU_AFFINITY: "1"
  NCCL_DEBUG: INFO                 # set 2026-08-30 to answer ONE question on the next
                                   # restart: which algorithm does NCCL already pick for the
                                   # ~14 KB decode all-reduces, and is the ring contiguous
                                   # across the two switches? Grep the startup log for
                                   #   "via Ring" / "via Tree" / "Channel .. : <ranks>"
                                   # If it is ALREADY Tree, forcing NCCL_ALGO=allreduce:tree
                                   # is pointless and the ~8 us/hop lives elsewhere.
                                   # Revert to WARN once read — INFO is very verbose.
  NCCL_NVLS_ENABLE: "0"
  NCCL_BUFFSIZE: "16777216"
  NCCL_MAX_NCHANNELS: "4"   # Veghes rec 2026-08-25; +50% prefill (876->1316 t/s), -3..-9% decode
  NCCL_MIN_NCHANNELS: "4"
  VLLM_MEMORY_PROFILER_ESTIMATE_CUDAGRAPHS: "0"
  VLLM_MEMORY_PROFILE_INCLUDE_ATTN: "0"
  INSTANTTENSOR_MAX_FREE_MEM_USAGE: "0.5"
  INSTANTTENSOR_COPY: "1"
  INSTANTTENSOR_BUFFER_SIZE: "536870912"
  VLLM_DSPARK_DRAFT_KV_WINDOW: "32768"
  VLLM_DCP_SHARD_DRAFT: "0"
  OMP_NUM_THREADS: "8"
  VLLM_USE_RAY_COMPILED_DAG_OVERLAP_COMM: "1"
  RAY_CGRAPH_get_timeout: "1800"
  RAY_memory_monitor_refresh_ms: "0"
  TORCH_EXTENSIONS_DIR: /root/.cache/huggingface/torch_extensions
  TORCHINDUCTOR_CACHE_DIR: /root/.cache/huggingface/torchinductor-cache
  TRITON_CACHE_DIR: /root/.cache/huggingface/triton-cache
  XDG_CACHE_HOME: /root/.cache/huggingface

command: |
  vllm serve {model_path} \
    --served-model-name KIMI-K3 \
    --attention-backend B12X_MLA \
    --tensor-parallel-size 16 \
    --pipeline-parallel-size 1 \
    --decode-context-parallel-size 16 \
    --dcp-kv-cache-interleave-size 1 \
    --enable-expert-parallel \
    --disable-custom-all-reduce \
    --distributed-executor-backend ray \
    --moe-backend marlin \
    --kv-cache-dtype fp8 \
    --load-format instanttensor \
    --gpu-memory-utilization 0.881 \
    --kv-cache-memory-bytes 5000000000 \
    --max-model-len 750000 \
    --host 0.0.0.0 --port 8000 \
    --trust-remote-code \
    --async-scheduling \
    --enable-chunked-prefill \
    --enable-prefix-caching \
    --speculative-config '{{"method":"dspark","model":"{draft_model_path}","num_speculative_tokens":8,"draft_tensor_parallel_size":1,"draft_sample_method":"greedy","rejection_sample_method":"block" ,"attention_backend":"TRITON_ATTN"}}' \
    --max-num-batched-tokens 4096 \
    --max-num-seqs 2 \
    --enforce-eager \
    --reasoning-parser kimi_k3 \
    --tool-call-parser kimi_k3 \
    --enable-auto-tool-choice \
    --generation-config vllm \
    --attention-config '{{"use_prefill_query_quantization":true}}' \
    --disable-uvicorn-access-log
